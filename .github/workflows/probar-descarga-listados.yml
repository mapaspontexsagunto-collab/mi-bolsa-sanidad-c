name: Probar descarga de listados publicos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descarga:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar fuentes y enlaces descargables
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, html.parser, json, datetime, pathlib
          urls=[
            "https://www.san.gva.es/es/web/recursos-humans/consultas",
            "https://www.san.gva.es/downloads/csportales/recursos-humans/es/listaContratadosCategoriaPaso2.html",
            "https://svsiscv.san.gva.es/btt-consulta/pages/index.xhtml?idioma=es&iframe=1&version=0"
          ]
          class Links(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=="a":
                href=dict(attrs).get("href")
                if href: self.links.append(href)
          report={"fecha_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"fuentes":[]}
          for url in urls:
            item={"url":url,"descarga_completa":False}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"MiBolsaSanidadCV/0.1 (+verificacion de fuentes publicas)"})
              with urllib.request.urlopen(req,timeout=25) as resp:
                body=resp.read(2_000_000); item["http"]=resp.status; item["tipo"]=resp.headers.get("Content-Type","");item["bytes_inspeccionados"]=len(body)
                if "html" in item["tipo"].lower():
                  parser=Links();parser.feed(body.decode("utf-8","replace"))
                  candidates=[urllib.parse.urljoin(url,h) for h in parser.links if any(x in h.lower().split("?")[0] for x in [".pdf",".csv",".xlsx",".zip"])]
                  item["enlaces_archivos_publicos"]=list(dict.fromkeys(candidates))[:100]
                else:
                  item["descarga_completa"]=True
            except Exception as exc:
              item["error"]=str(exc)[:300]
            report["fuentes"].append(item)
          pathlib.Path("informe").mkdir(exist_ok=True)
          pathlib.Path("informe/descarga.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: informe-prueba-descarga
          path: informe/descarga.json
